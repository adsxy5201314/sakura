<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sakura · 个人主页</title>
<meta name="description" content="我的个人主页与作品集" />
<style>
  :root {
    --bg: #fffafc;
    --surface: #ffffff;
    --text: #2b2230;
    --muted: #7a6d80;
    --accent: #e86a92;
    --accent-soft: #fde4ec;
    --border: #f1dde5;
    --shadow: 0 8px 30px rgba(232, 106, 146, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15121a;
      --surface: #1f1a25;
      --text: #f3eaf2;
      --muted: #a89bb0;
      --accent: #ff8fb1;
      --accent-soft: #3a2532;
      --border: #2f2735;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15121a;
    --surface: #1f1a25;
    --text: #f3eaf2;
    --muted: #a89bb0;
    --accent: #ff8fb1;
    --accent-soft: #3a2532;
    --border: #2f2735;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  .wrap { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 0 16px; }

  nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { font-weight: 700; color: var(--text); }
  .links { display: flex; gap: 18px; align-items: center; }
  .links a { color: var(--muted); font-size: 15px; }
  .links a:hover { color: var(--accent); text-decoration: none; }
  #themeBtn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px;
  }

  header.hero { padding: 72px 0 48px; text-align: center; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    margin: 0 auto 20px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
    font-size: 44px; font-weight: 700; box-shadow: var(--shadow);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: clamp(28px, 6vw, 40px); margin: 0 0 6px; }
  .tagline { color: var(--muted); margin: 0 0 24px; font-size: 17px; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 10px 22px; border-radius: 999px;
    border: 1px solid var(--accent); font-size: 15px;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:hover { text-decoration: none; opacity: .88; }

  section { padding: 40px 0; }
  h2 { font-size: 22px; margin: 0 0 20px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ""; width: 6px; height: 22px; border-radius: 3px; background: var(--accent); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px; box-shadow: var(--shadow);
  }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .tag {
    background: var(--accent-soft); color: var(--accent);
    padding: 3px 12px; border-radius: 999px; font-size: 13px;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .project h3 { margin: 0 0 6px; font-size: 18px; }
  .project p { margin: 0; color: var(--muted); font-size: 15px; }
  .project .more { display: inline-block; margin-top: 12px; font-size: 14px; }
  .project { transition: transform .2s; }
  .project:hover { transform: translateY(-3px); }

  .contact { display: flex; flex-wrap: wrap; gap: 12px; }
  .contact a {
    background: var(--surface); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 12px; color: var(--text);
  }
  .contact a:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0 32px; }

  @media (max-width: 520px) {
    .links a.hide-sm { display: none; }
    header.hero { padding-top: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .project { transition: none; }
  }
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>

<nav>
  <div class="wrap">
    <a class="logo" href="#top" id="logo">Sakura</a>
    <div class="links">
      <a href="#about" class="hide-sm">关于</a>
      <a href="#projects">作品</a>
      <a href="#contact">联系</a>
      <button id="themeBtn" aria-label="切换深浅色">◐</button>
    </div>
  </div>
</nav>

<main class="wrap" id="top">
  <header class="hero">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="btns">
      <a class="btn primary" href="#projects">看看作品</a>
      <a class="btn" href="#contact">联系我</a>
    </div>
  </header>

  <section id="about">
    <h2>关于我</h2>
    <div class="card">
      <p id="bio" style="margin:0"></p>
      <div class="tags" id="skills"></div>
    </div>
  </section>

  <section id="projects">
    <h2>作品</h2>
    <div class="grid" id="projectList"></div>
  </section>

  <section id="contact">
    <h2>联系方式</h2>
    <div class="contact" id="contactList"></div>
  </section>
</main>

<footer id="footer"></footer>

<script>
/* ============================================================
 * 想改内容？只需要修改下面这个 PROFILE 对象就行
 * ============================================================ */
const PROFILE = {
  name: "你的名字",
  avatar: "",                 // 头像图片地址，留空就显示名字首字
  tagline: "一句话介绍你自己 · 例如：学生 / 开发者 / 设计爱好者",
  bio: "在这里写一段自我介绍：你是谁、喜欢做什么、正在学习什么。",
  skills: ["HTML", "CSS", "JavaScript", "摄影", "设计"],
  projects: [
    {
      title: "念念生日快乐",
      desc: "一个带爱心浮动动画的生日祝福网页。",
      link: "https://github.com/adsxy5201314/sakura/blob/e55e7a1/index.html"
    },
    {
      title: "项目二",
      desc: "简单描述这个项目做了什么、用了什么技术。",
      link: ""
    },
    {
      title: "项目三",
      desc: "简单描述这个项目做了什么、用了什么技术。",
      link: ""
    }
  ],
  contacts: [
    { label: "GitHub", url: "https://github.com/adsxy5201314" },
    { label: "邮箱", url: "mailto:you@example.com" }
  ]
};

/* ---------- 渲染页面 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

document.title = PROFILE.name + " · 个人主页";
$("logo").textContent = PROFILE.name;
$("name").textContent = PROFILE.name;
$("tagline").textContent = PROFILE.tagline;
$("bio").textContent = PROFILE.bio;
$("avatar").innerHTML = PROFILE.avatar
  ? `<img src="${esc(PROFILE.avatar)}" alt="${esc(PROFILE.name)}">`
  : esc(PROFILE.name.trim().charAt(0) || "S");
$("skills").innerHTML = PROFILE.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("");
$("projectList").innerHTML = PROFILE.projects.map(p => `
  <div class="card project">
    <h3>${esc(p.title)}</h3>
    <p>${esc(p.desc)}</p>
    ${p.link ? `<a class="more" href="${esc(p.link)}" target="_blank" rel="noopener">查看 →</a>` : ""}
  </div>`).join("");
$("contactList").innerHTML = PROFILE.contacts.map(c =>
  `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.label)}</a>`).join("");
$("footer").textContent = `© ${new Date().getFullYear()} ${PROFILE.name} · Made with 🌸`;

/* ---------- 深浅色切换 ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("themeBtn").onclick = () => {
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
};

/* ---------- 樱花飘落 ---------- */
(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("petals"), ctx = cv.getContext("2d");
  let W, H, petals = [];
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  addEventListener("resize", resize); resize();
  const count = Math.min(28, Math.floor(W / 40));
  const make = (y) => ({
    x: Math.random() * W, y: y ?? Math.random() * H,
    r: 4 + Math.random() * 5, vy: 0.4 + Math.random() * 0.8,
    vx: -0.3 + Math.random() * 0.6, a: Math.random() * Math.PI * 2,
    va: 0.01 + Math.random() * 0.02
  });
  for (let i = 0; i < count; i++) petals.push(make());
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of petals) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.a) * 0.4; p.a += p.va;
      if (p.y > H + 10) Object.assign(p, make(-10));
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = "rgba(255, 170, 196, 0.55)";
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
